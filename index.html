["Изучение инструментальных средств информационных систем","VS Code, Git, draw.io, браузер","Инструментальные средства ИС — это программы для моделирования, разработки, тестирования и сопровождения систем (CASE-средства, IDE, СУБД, системы контроля версий).","Установите VS Code и Git|Создайте репозиторий и первый коммит|Установите расширения для HTML и SQL|Составьте обзор 5 инструментов","Сравните 3 IDE по критериям|Опишите жизненный цикл ИС и инструмент для каждого этапа","Настройте GitHub-репозиторий с README","Что такое CASE-средство?~Программа для автоматизации проектирования ИС~Текстовый редактор~Антивирус|Для чего нужна система контроля версий?~Хранить историю изменений кода~Сжимать видео~Рисовать диаграммы"],
["Проектирование структуры информационной системы","draw.io, Lucidchart, UML","Структура ИС включает подсистемы, модули, данные, интерфейсы и пользователей. Проектирование начинается с требований и архитектуры.","Опишите предметную область|Выделите роли пользователей|Нарисуйте диаграмму вариантов использования|Постройте схему архитектуры","Спроектируйте ИС «Учёт студентов»|Составьте список функциональных требований","Добавьте диаграмму компонентов UML","Какая диаграмма UML показывает сценарии использования?~Use Case~Class~Sequence|Что такое архитектура ИС?~Организация компонентов и связей~Цвет интерфейса~Размер базы"],
["Создание диаграмм бизнес-процессов","BPMN (Bizagi, draw.io), IDEF0","Бизнес-процесс — последовательность действий для получения результата. BPMN описывает события, задачи и шлюзы.","Выберите процесс (например, приём заказа)|Определите участников и дорожки (pools/lanes)|Постройте диаграмму в BPMN|Проверьте на логические ошибки","Смоделируйте процесс «Регистрация на курс»|Опишите процесс как есть (AS-IS)","Постройте целевую модель TO-BE","Что в BPMN обозначает ромб?~Шлюз (ветвление)~Задачу~Начало процесса|Что такое AS-IS?~Текущее состояние процесса~Будущая модель~Тип базы данных"],
["Проектирование базы данных в MySQL","MySQL Workbench, ER-диаграммы","Проектирование БД включает ER-модель, ключи, связи и нормализацию (1НФ–3НФ).","Определите сущности и атрибуты|Назначьте первичные ключи|Задайте связи 1:N и M:N|Постройте EER-диаграмму в Workbench|Приведите схему к 3НФ","Спроектируйте БД «Библиотека»|Опишите связи и ключи","Выполните Forward Engineering в SQL-скрипт","Что гарантирует первичный ключ?~Уникальность строки~Шифрование~Сортировку|Какая связь требует таблицы-связки?~Многие ко многим~Один к одному~Нет такой"],
["Создание и управление базой данных","MySQL, phpMyAdmin, SQL","SQL включает DDL (CREATE, ALTER), DML (INSERT, UPDATE, DELETE, SELECT) и управление доступом (GRANT).","CREATE DATABASE и CREATE TABLE|Заполните таблицы через INSERT|Напишите SELECT с JOIN и GROUP BY|Создайте пользователя и права","Создайте таблицы по проекту ЛР4|Напишите 5 запросов разной сложности","Добавьте индекс и сравните скорость запросов (EXPLAIN)","Какая команда читает данные?~SELECT~INSERT~DROP|Что делает JOIN?~Объединяет таблицы по условию~Удаляет таблицу~Создаёт индекс"],
["Разработка веб-интерфейса с HTML и CSS","HTML5, CSS3, VS Code, DevTools","HTML задаёт структуру страницы, CSS — оформление. Адаптивность достигается медиазапросами, flex и grid.","Создайте семантическую разметку|Подключите CSS|Сверстайте шапку, меню и карточки|Сделайте адаптивную вёрстку","Сверстайте главную страницу ИС|Проверьте отображение на телефоне","Добавьте тёмную тему через CSS-переменные","Какой тег задаёт навигацию?~nav~menu~div id=go|Что делает @media?~Применяет стили по условиям экрана~Подключает шрифт~Создаёт анимацию"],
["Создание интерактивных веб-форм с JavaScript","JavaScript, DOM, DevTools","JavaScript обрабатывает события, проверяет данные формы и динамически изменяет страницу через DOM.","Создайте форму с полями|Подключите script и обработчик submit|Реализуйте валидацию|Покажите сообщения об ошибках","Форма заявки с проверкой email и телефона|Динамический список добавленных заявок","Сохраняйте данные в localStorage","Что возвращает document.getElementById?~Элемент DOM~Массив строк~Число|Какое событие срабатывает при отправке формы?~submit~load~scroll"],
["Разработка информационной системы в MS Access","Microsoft Access","Access сочетает СУБД, запросы, формы и отчёты. Подходит для небольших ИС.","Создайте таблицы и схему данных|Постройте запросы|Создайте формы ввода|Сформируйте отчёт|Добавьте главную кнопочную форму","Разработайте ИС «Склад»|Подготовьте отчёт по остаткам","Автоматизируйте действие макросом","Какой объект Access выводит данные для печати?~Отчёт~Макрос~Модуль|Где задаются связи между таблицами?~Схема данных~Форма~Отчёт"],
["Автоматизация обработки данных в Excel","Excel, Power Query, VBA","Excel автоматизирует расчёты формулами, сводными таблицами, Power Query и макросами VBA.","Импортируйте данные|Очистите их в Power Query|Примените ВПР/XLOOKUP и СУММЕСЛИ|Постройте сводную таблицу и диаграмму","Подготовьте отчёт по продажам|Автоматизируйте обновление данных","Запишите макрос для форматирования отчёта","Какой инструмент группирует и суммирует данные?~Сводная таблица~Фильтр~Рецензирование|Для чего нужен Power Query?~Загрузка и преобразование данных~Рисование фигур~Печать"],

["Работа с REST API","Postman, fetch, JSON","REST API — интерфейс обмена данными по HTTP с методами GET, POST, PUT, DELETE. Данные чаще в формате JSON.","Откройте Postman|Отправьте GET на открытый API|Изучите коды ответа|Отправьте POST с JSON|Выведите данные через fetch","Получите список пользователей из тестового API|Создайте запись методом POST","Реализуйте авторизацию по токену","Какой метод создаёт ресурс?~POST~GET~HEAD|Что означает код 404?~Ресурс не найден~Успех~Ошибка сервера"],
["Тестирование информационной системы","Selenium, Postman, Jest, чек-листы","Виды тестирования: модульное, интеграционное, системное, приёмочное. Результат фиксируется в тест-кейсах и баг-репортах.","Составьте чек-лист|Напишите тест-кейсы|Выполните тестирование|Оформите баг-репорты","Протестируйте форму из ЛР7|Составьте 10 тест-кейсов","Напишите автотест на Jest","Что проверяет модульное тестирование?~Отдельные функции и модули~Только дизайн~Скорость интернета|Что содержит баг-репорт?~Шаги воспроизведения и ожидаемый результат~Только оценку~Счёт"],
["Разработка системы регистрации и авторизации","HTML, JS, PHP/Node.js, хэширование","Аутентификация проверяет личность, авторизация — права. Пароли хранят только в виде хэша (bcrypt) и передают по HTTPS.","Спроектируйте таблицу users|Сделайте форму регистрации|Хэшируйте пароль|Реализуйте вход и сессию|Разграничьте роли","Реализуйте регистрацию и вход|Ограничьте доступ к странице админа","Добавьте двухфакторную проверку","Как правильно хранить пароли?~Хэш с солью~Открытым текстом~В cookie|Чем авторизация отличается от аутентификации?~Проверка прав vs проверка личности~Ничем~Это скорость"],
